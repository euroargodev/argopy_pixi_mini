name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        environment: [py312, py313]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false

      - name: Run tests
        run: pixi run --locked -e ${{ matrix.environment }} test

      - name: Show installed packages
        run: pixi list -e ${{ matrix.environment }}

      - name: Build wheel
        run: pixi exec --spec python-build -- python -m build --wheel